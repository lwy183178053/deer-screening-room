name: ${DEER_COMPOSE_PROJECT_NAME:-deer-screening-room}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deerroom}
      POSTGRES_USER: ${POSTGRES_USER:-deerroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deerroom-local-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  coturn:
    image: coturn/coturn:4.6.3@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888
    restart: unless-stopped
    environment:
      DEER_TURN_SECRET: ${DEER_TURN_SECRET:-local-turn-secret-change-me}
      DEER_TURN_EXTERNAL_IP: ${DEER_TURN_EXTERNAL_IP}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        exec turnserver --no-cli --no-tls --no-dtls --fingerprint --use-auth-secret
        --static-auth-secret="$${DEER_TURN_SECRET}" --realm=deerroom.local
        --external-ip="$${DEER_TURN_EXTERNAL_IP}" --listening-port=3478
        --min-port=49160 --max-port=49200 --no-multicast-peers --no-loopback-peers
        --log-file=stdout
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    read_only: true
    tmpfs: [/tmp, /var/run]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m

  gateway:
    build: .
    image: deerroom-app:dev
    command: ["/app/gateway"]
    environment:
      DEER_ROLE: gateway
      DEER_HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-deerroom}:${POSTGRES_PASSWORD:-deerroom-local-password}@postgres:5432/${POSTGRES_DB:-deerroom}?sslmode=disable
      DEER_COOKIE_SECURE: "false"
      DEER_BOOTSTRAP_ADMIN: ${DEER_BOOTSTRAP_ADMIN:-admin@example.com}
      DEER_BOOTSTRAP_PASSWORD: ${DEER_BOOTSTRAP_PASSWORD:-deerroom-admin-password}
      DEER_NODE_API_TOKEN: ${DEER_NODE_API_TOKEN:-local-node-api-token-change-me}
      DEER_PASSWORD_HASH_CONCURRENCY: ${DEER_PASSWORD_HASH_CONCURRENCY:-4}
      DEER_USER_STREAM_REQUESTS_PER_MINUTE: ${DEER_USER_STREAM_REQUESTS_PER_MINUTE:-120}
      DEER_TURN_URLS: ${DEER_TURN_URLS:-turn:localhost:3478?transport=udp,turn:localhost:3478?transport=tcp}
      DEER_TURN_SECRET: ${DEER_TURN_SECRET:-local-turn-secret-change-me}
      DEER_TURN_TTL: ${DEER_TURN_TTL:-2h}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend, edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m

  media-node:
    build: .
    image: deerroom-app:dev
    command: ["/app/media-node"]
    environment:
      DEER_ROLE: media-node
      DEER_HTTP_ADDR: :8081
      DEER_GATEWAY_URL: ${DEER_GATEWAY_URL:-http://gateway:8080}
      DEER_NODE_NAME: ${DEER_NODE_NAME:-local-media}
      DEER_NODE_PUBLIC_URL: ${DEER_NODE_PUBLIC_URL:-http://media-node:8081}
      DEER_NODE_API_TOKEN: ${DEER_NODE_API_TOKEN:-local-node-api-token-change-me}
      DEER_MEDIA_ROOT: /media
      DEER_POSTER_ROOT: /app/posters
      DEER_SCAN_INTERVAL: 10m
    volumes:
      - ${DEER_MEDIA_HOST_PATH:-E:/BaiduNetdiskDownload}:/media:ro
      - poster-data:/app/posters
    depends_on:
      gateway:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g

  web:
    build: ./web
    image: deerroom-web:dev
    ports:
      - "8080:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [edge]

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres-data:
  poster-data:

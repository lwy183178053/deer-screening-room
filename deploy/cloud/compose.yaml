name: deer-screening-room-cloud

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  wireguard:
    image: lscr.io/linuxserver/wireguard@sha256:ac43e1226878d2611315172d6ea357a95cb326ee73124b91108118efc8666889
    restart: unless-stopped
    cap_add: [NET_ADMIN, SYS_MODULE]
    environment:
      PUID: 0
      PGID: 0
      TZ: Asia/Shanghai
    ports:
      - "${DEER_WIREGUARD_PORT:-51820}:51820/udp"
    volumes:
      - ./wireguard:/config
      - /lib/modules:/lib/modules:ro
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
    networks: [backend, edge]

  gateway:
    build:
      context: ../..
    image: deerroom-app:${DEER_VERSION:-latest}
    command: ["/app/gateway"]
    restart: unless-stopped
    network_mode: service:wireguard
    environment:
      DEER_ROLE: gateway
      DEER_HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DEER_COOKIE_SECURE: "true"
      DEER_BOOTSTRAP_ADMIN: ${DEER_BOOTSTRAP_ADMIN}
      DEER_BOOTSTRAP_PASSWORD: ${DEER_BOOTSTRAP_PASSWORD}
      DEER_NODE_CREDENTIALS: ${DEER_NODE_CREDENTIALS}
      DEER_PASSWORD_HASH_CONCURRENCY: ${DEER_PASSWORD_HASH_CONCURRENCY:-4}
      DEER_USER_STREAM_REQUESTS_PER_MINUTE: ${DEER_USER_STREAM_REQUESTS_PER_MINUTE:-120}
    depends_on:
      postgres:
        condition: service_healthy
      wireguard:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m

  web:
    build:
      context: ../../web
    image: deerroom-web:${DEER_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DEER_DOMAIN: ${DEER_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [gateway]
    networks: [edge]

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

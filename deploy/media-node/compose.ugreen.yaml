name: ${DEER_COMPOSE_PROJECT_NAME:-deer}

services:
  wg-init:
    container_name: deer-wg-init
    image: ${DEER_CONFIG_IMAGE:-alpine:3.22}
    restart: "no"
    environment:
      DEER_NODE_WIREGUARD_ADDRESS: ${DEER_NODE_WIREGUARD_ADDRESS}
      DEER_WIREGUARD_PRIVATE_KEY: ${DEER_WIREGUARD_PRIVATE_KEY}
      DEER_CLOUD_WIREGUARD_PUBLIC_KEY: ${DEER_CLOUD_WIREGUARD_PUBLIC_KEY}
      DEER_CLOUD_ENDPOINT: ${DEER_CLOUD_ENDPOINT}
      DEER_GATEWAY_WIREGUARD_ADDRESS: ${DEER_GATEWAY_WIREGUARD_ADDRESS:-10.77.0.1}
    volumes:
      - wireguard-data:/output
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        install -d -m 700 /output/wg_confs;
        umask 077;
        printf '[Interface]\nAddress = %s\nPrivateKey = %s\n\n[Peer]\nPublicKey = %s\nEndpoint = %s\nAllowedIPs = %s/32\nPersistentKeepalive = 25\n' "$${DEER_NODE_WIREGUARD_ADDRESS}" "$${DEER_WIREGUARD_PRIVATE_KEY}" "$${DEER_CLOUD_WIREGUARD_PUBLIC_KEY}" "$${DEER_CLOUD_ENDPOINT}" "$${DEER_GATEWAY_WIREGUARD_ADDRESS}" > /output/wg_confs/wg0.conf
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 64m

  wg:
    container_name: deer-wg
    image: ${DEER_WIREGUARD_IMAGE:-lscr.io/linuxserver/wireguard@sha256:ac43e1226878d2611315172d6ea357a95cb326ee73124b91108118efc8666889}
    restart: unless-stopped
    cap_add: [NET_ADMIN, SYS_MODULE]
    environment:
      PUID: 0
      PGID: 0
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - wireguard-data:/config
      - /lib/modules:/lib/modules:ro
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
    healthcheck:
      test: ["CMD-SHELL", "wg show wg0 >/dev/null 2>&1"]
      interval: 3s
      timeout: 2s
      retries: 20
    depends_on:
      wg-init:
        condition: service_completed_successfully

  node:
    container_name: deer-node
    image: ${DEER_IMAGE:-ghcr.io/lwy183178053/deer-screening-room}:${DEER_VERSION:-latest}
    pull_policy: ${DEER_PULL_POLICY:-missing}
    command: ["/app/media-node"]
    restart: unless-stopped
    network_mode: service:wg
    environment:
      DEER_ROLE: media-node
      DEER_HTTP_ADDR: ${DEER_HTTP_ADDR:-:8081}
      DEER_GATEWAY_URL: ${DEER_GATEWAY_URL:-http://10.77.0.1:8080}
      DEER_NODE_NAME: ${DEER_NODE_NAME}
      DEER_NODE_PUBLIC_URL: ${DEER_NODE_PUBLIC_URL}
      DEER_NODE_API_TOKEN: ${DEER_NODE_API_TOKEN}
      DEER_RELAY_TOKEN: ${DEER_RELAY_TOKEN}
      DEER_MEDIA_SOURCE_ROOT: /source
      DEER_MEDIA_ROOT: /media
      DEER_POSTER_ROOT: /app/posters
      DEER_SCAN_INTERVAL: ${DEER_SCAN_INTERVAL:-10m}
    volumes:
      - ${DEER_MEDIA_HOST_PATH}:/source:ro
      - media-view:/media
      - ${DEER_POSTER_HOST_PATH:-./posters}:/app/posters
    depends_on:
      wg:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g

volumes:
  wireguard-data:
  media-view:
